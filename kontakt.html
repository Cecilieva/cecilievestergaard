<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontakt — Cecilie Vestergaard Andersen</title>
<meta name="description" content="Skriv til Cecilie Vestergaard Andersen.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141414'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23F3F0E8' font-family='Georgia'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a class="logo" href="index.html" aria-label="Forside">C.V</a>
  <nav class="site-nav" aria-label="Hovedmenu">
    <a href="projekter.html">PROJEKTER</a>
    <a href="om-mig.html">OM MIG</a>
    <a href="kontakt.html" aria-current="page">KONTAKT</a>
  </nav>
</header>

<main class="wrap">
  <section class="page-hero" style="padding-top: 100px">
    <div class="label" style="color: var(--muted); margin-bottom: 20px">Kontakt</div>
    <h1>Get in <span class="it">touch</span> ↗</h1>
    <a href="mailto:Cecilieva@outlook.dk" style="display: inline-block; margin-top: 40px; font-size: clamp(24px, 3vw, 40px); letter-spacing: -0.02em; text-underline-offset: 8px">Cecilieva@outlook.dk</a>
  </section>

  <section class="contact-grid">
    <div class="social">
      <div class="label" style="font-family: var(--sans); color: var(--muted); margin-bottom: 10px">Find mig her</div>
      <a href="#">Instagram ↗</a>
      <a href="#">LinkedIn ↗</a>
      <a href="#">TikTok ↗</a>
    </div>
    <form class="contact-form" id="contact-form">
      <div class="label" style="color: var(--muted)">Send en besked</div>
      <div class="two">
        <label>Navn<input class="field" type="text" name="navn" placeholder="Dit navn" autocomplete="name" required></label>
        <label>E-mail<input class="field" type="email" name="email" placeholder="din@mail.dk" autocomplete="email" required></label>
      </div>
      <label>Besked<textarea class="field" name="besked" rows="4" placeholder="Hvad vil du gerne snakke om?" style="resize: vertical" required></textarea></label>
      <button type="submit" class="btn">Send besked <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F3F0E8" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </section>
</main>

<footer class="site-footer">
  <div class="row">
    <nav class="footer-links" style="margin: 0" aria-label="Footer"><a href="projekter.html">Projekter</a><a href="om-mig.html">Om mig</a><a href="kontakt.html">Kontakt</a></nav>
    <div style="font-size: 11px; color: #666">© <span data-year>2026</span> Cecilie Vestergaard Andersen</div>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
